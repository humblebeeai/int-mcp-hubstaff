services:
  hubstaff-mcp:
    build: .
    container_name: hubstaff-mcp-server
    ports:
      - "25088:8000"
    env_file:
      - .env
    volumes:
      # Directory mount (not a single file): the OAuth broker uses SQLite with
      # WAL sidecar files (oauth.db, oauth.db-wal, oauth.db-shm), which cannot
      # live under a single-file bind mount. Pre-create ./data owned by the
      # container's mcp user before the first `docker compose up`.
      - ./data:/app/data
    restart: unless-stopped
